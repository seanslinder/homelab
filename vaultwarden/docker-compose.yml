services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: https://lenovo.netbird.cloud/vaultwarden
    volumes:
      - /vw-data/:/data/
    networks:
      - default
      - homelab

networks:
  homelab:
    external: true
