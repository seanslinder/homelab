services:
  dashdot:
    image: mauricenino/dashdot:latest
    container_name: dashdot
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/mnt/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DASHDOT_HOSTNAME: ${DASHDOT_HOSTNAME:-lenovo}
    networks:
      - default
      - homelab

networks:
  homelab:
    external: true
